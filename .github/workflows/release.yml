name: Build and Release

on:
  push:
    branches:
      - main # Ou le nom de ta branche principale

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Nécessaire pour comparer avec le commit précédent
          persist-credentials: false

      - name: Check version change
        id: check_version
        shell: bash
        run: |
          set -euo pipefail

          # Récupère la version actuelle et la précédente
          NEW_VERSION=$(node -p "require('./package.json').version")

          if git rev-parse --verify --quiet 'HEAD^1^{commit}' >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "0.0.0")
          else
            OLD_VERSION="0.0.0"
          fi

          echo "Version précédente : $OLD_VERSION"
          echo "Version actuelle    : $NEW_VERSION"

          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Version inchangée : aucune release à publier."
          fi

      - name: Setup Node.js
        if: steps.check_version.outputs.version_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajuste selon ta version d'Adonis

      - name: Restore npm cache
        if: steps.check_version.outputs.version_changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/node-gyp
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install dependencies
        if: steps.check_version.outputs.version_changed == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build project
        if: steps.check_version.outputs.version_changed == 'true'
        run: npm run build

      - name: Zip Build
        if: steps.check_version.outputs.version_changed == 'true'
        run: zip -r build-v${{ steps.check_version.outputs.new_version }}.zip build/

      - name: Create Release
        if: steps.check_version.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.new_version }}
          name: Release v${{ steps.check_version.outputs.new_version }}
          generate_release_notes: true
          files: build-v${{ steps.check_version.outputs.new_version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
